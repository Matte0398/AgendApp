<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta
      name="description"
      content="AgendApp: your bilingual personal address book with dark mode, search, CSV import and export."
    />
    <title>AgendApp</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("agenda.theme.v1") === "light"
            ? "light"
            : "dark";
        document.documentElement.lang =
          localStorage.getItem("agenda.language.v1") === "it" ? "it" : "en";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
